[package]
name = "pomodo"
version = "0.1.0"
description = "Cross-platform Pomodoro timer and task manager for Desktop, Android, and iOS."
authors = ["Samu Kaarlela"]
license = "FSL-1.1-MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pomodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-haptics = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["macros"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros", "migrate"] }
fs = "0.0.5"
futures = "0.3.31"
chrono = { version = "0.4.41", features = ["serde"] }
paste = "1.0.15"
syn = "2.0.106"
quote = "1.0.40"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1.14", features = ["v4"] }
specta = { version = "=2.0.0-rc.22", features = ["chrono", "serde"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-safe-area-insets-css = "0.2.0"
tauri-plugin-global-shortcut = "2.3.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

