<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodo</title>
    <style>
        :root {
            --bg-color: #0F0F0F;
            --accent-color: #FF5252;
            --text-color: #E0E0E0;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1A1A1A 0%, #0F0F0F 100%);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .logo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: containerIn 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .logo {
            width: 90px;
            height: 90px;
            z-index: 2;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
        }
        .logo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: ringPulse 3s infinite ease-in-out;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 0;
            opacity: 0;
            animation: textFadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 0.4s;
            background: linear-gradient(180deg, #FFFFFF 0%, #A0A0A0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .loader {
            width: 40px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            opacity: 0;
            animation: textFadeIn 1s ease forwards;
            animation-delay: 0.8s;
        }
        .loader-bar {
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            transform: translateX(-100%);
            animation: load 2s infinite ease-in-out;
        }
        @keyframes containerIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes textFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 0.9; transform: translateY(0); }
        }
        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.1; }
            50% { transform: scale(1.05); opacity: 0.3; }
            100% { transform: scale(0.95); opacity: 0.1; }
        }
        @keyframes load {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <img src="/transparent_logo.svg" alt="Logo" class="logo">
        </div>
        <h1>Pomodo</h1>
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
    </div>
</body>
</html>
